[workspace]
exclude = ["external"]

[package]
name = "cuo-ultimalive"
version = "0.1.0"
edition = "2021"

[dependencies]
cuo-mod-sdk = { git = "https://github.com/ClassicUO/classicuo-mods-sdk", rev = "de00483" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
